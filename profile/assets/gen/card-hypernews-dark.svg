<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 770" width="740" height="770" role="img" aria-label="Hyper News: The news, by what happened."><title>Hyper News</title><desc>The news, by what happened. Every killing, crash, flood or arrest the news reports, anywhere, on one map, with the figures reconciled across independent reports and every statement linked to the sentence it came from. No language model reads the news.</desc><style>.glow{opacity:0.75}.warm{opacity:0.7}</style><defs><linearGradient id="cardfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b222c"/><stop offset="1" stop-color="#121820"/></linearGradient><radialGradient id="accentglow" cx="0" cy="0" r="0.75" gradientTransform="scale(0.6 1)"><stop offset="0" stop-color="#ef4444" stop-opacity="0.16"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient><linearGradient id="glowfill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="0.5" stop-color="#f58220"/><stop offset="1" stop-color="#ea580c"/></linearGradient><linearGradient id="warmfill" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#f58220" stop-opacity="0.2"/><stop offset="0.55" stop-color="#f58220" stop-opacity="0.04"/><stop offset="1" stop-color="#ffb347" stop-opacity="0.12"/></linearGradient><filter id="soft" x="-15%" y="-15%" width="130%" height="135%"><feGaussianBlur stdDeviation="20"/></filter><filter id="lift" x="-5%" y="-8%" width="110%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity="0.55"/></filter></defs><g font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><rect class="glow" x="36" y="48" width="668" height="692" rx="26" fill="url(#glowfill)" filter="url(#soft)"/><rect x="40" y="40" width="660" height="690" rx="22" fill="url(#cardfill)" stroke="#30363d" stroke-width="1.5" filter="url(#lift)"/><rect x="40" y="40" width="660" height="690" rx="22" fill="url(#accentglow)"/><rect class="warm" x="40" y="40" width="660" height="690" rx="22" fill="url(#warmfill)"/><rect x="40" y="66" width="5" height="638" rx="2.5" fill="#ef4444"/><svg x="80" y="80" width="120" height="120" viewBox="0 0 96 96"><rect x="4" y="4" width="88" height="88" rx="20" fill="#0f172a"/><rect x="4.75" y="4.75" width="86.5" height="86.5" rx="19.25" fill="none" stroke="#2b3a52" stroke-width="1.5"/><g transform="scale(3)" fill="none" stroke="#f9fafb"><circle cx="16" cy="16" r="10.5" stroke-width="2"/><path d="M5.5 16h21M16 5.5c-3.6 3.2-5.2 6.7-5.2 10.5s1.6 7.3 5.2 10.5M16 5.5c3.6 3.2 5.2 6.7 5.2 10.5s-1.6 7.3-5.2 10.5" stroke-width="1.3"/></g><circle cx="64.5" cy="31.5" r="9.6" fill="#ef4444"/></svg><text x="228" y="160.4" font-size="60" font-weight="800" fill="#f0f6fc" letter-spacing="-0.5">Hyper News</text><text x="80" y="264.0" font-size="34" font-weight="600" fill="#ef4444">The news, by what happened.</text><text x="80" y="328.0" font-size="32" fill="#9ea8b3">Every killing, crash, flood or arrest</text><text x="80" y="374.0" font-size="32" fill="#9ea8b3">the news reports, anywhere, on one</text><text x="80" y="420.0" font-size="32" fill="#9ea8b3">map, with the figures reconciled</text><text x="80" y="466.0" font-size="32" fill="#9ea8b3">across independent reports and every</text><text x="80" y="512.0" font-size="32" fill="#9ea8b3">statement linked to the sentence it</text><text x="80" y="558.0" font-size="32" fill="#9ea8b3">came from. No language model reads</text><text x="80" y="604.0" font-size="32" fill="#9ea8b3">the news.</text><rect x="80.0" y="634" width="212.0" height="56" rx="28.0" fill="#2ea043" fill-opacity="0.16" stroke="#2ea043" stroke-opacity="0.55" stroke-width="1.5"/><text x="186.0" y="671.0" font-size="28" font-weight="600" fill="#7ee2a8" text-anchor="middle">Free to read</text><rect x="304.0" y="634" width="226.8" height="56" rx="28.0" fill="#8b949e" fill-opacity="0.16" stroke="#8b949e" stroke-opacity="0.55" stroke-width="1.5"/><text x="417.4" y="671.0" font-size="28" font-weight="600" fill="#c4ccd4" text-anchor="middle">Closed source</text></g></svg>
