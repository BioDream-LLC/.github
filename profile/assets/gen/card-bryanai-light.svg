<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 814" width="740" height="814" role="img" aria-label="bryanAI: A reasoning engine for argumentation."><title>bryanAI</title><desc>A reasoning engine for argumentation. Decides which arguments stand when claims attack one another, built on the CaDiCaL SAT solver. Every answer is checked against the definition before it is given; when it cannot be sure, it says so rather than guess.</desc><style>.glow{opacity:0.5}.warm{opacity:0.7}</style><defs><linearGradient id="cardfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fa"/></linearGradient><radialGradient id="accentglow" cx="0" cy="0" r="0.75" gradientTransform="scale(0.6 1)"><stop offset="0" stop-color="#0ea5e9" stop-opacity="0.09"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient><linearGradient id="glowfill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="0.5" stop-color="#f58220"/><stop offset="1" stop-color="#ea580c"/></linearGradient><linearGradient id="warmfill" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#f58220" stop-opacity="0.1"/><stop offset="0.55" stop-color="#f58220" stop-opacity="0.04"/><stop offset="1" stop-color="#ffb347" stop-opacity="0.06"/></linearGradient><filter id="soft" x="-15%" y="-15%" width="130%" height="135%"><feGaussianBlur stdDeviation="20"/></filter><filter id="lift" x="-5%" y="-8%" width="110%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2328" flood-opacity="0.14"/></filter></defs><g font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><rect class="glow" x="36" y="48" width="668" height="736" rx="26" fill="url(#glowfill)" filter="url(#soft)"/><rect x="40" y="40" width="660" height="734" rx="22" fill="url(#cardfill)" stroke="#d0d7de" stroke-width="1.5" filter="url(#lift)"/><rect x="40" y="40" width="660" height="734" rx="22" fill="url(#accentglow)"/><rect class="warm" x="40" y="40" width="660" height="734" rx="22" fill="url(#warmfill)"/><rect x="40" y="66" width="5" height="682" rx="2.5" fill="#0ea5e9"/><svg x="80" y="80" width="120" height="120" viewBox="0 0 96 96"><rect x="4" y="4" width="88" height="88" rx="20" fill="#0f172a"/><rect x="4.75" y="4.75" width="86.5" height="86.5" rx="19.25" fill="none" stroke="#2b3a52" stroke-width="1.5"/><defs><linearGradient id="bag" gradientUnits="userSpaceOnUse" x1="18" y1="18" x2="78" y2="78"><stop offset="0" stop-color="#7dd3fc"/><stop offset=".55" stop-color="#38bdf8"/><stop offset="1" stop-color="#0284c7"/></linearGradient></defs><g stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none"><path d="M30 35 L42 58"/><path d="M66 35 L54 58"/><path d="M42 30 H32"/><path d="M54 30 H64"/></g><g fill="#94a3b8"><path d="M44.5 62 l-7 -3.5 l5.5 -3.2 Z"/><path d="M51.5 62 l7 -3.5 l-5.5 -3.2 Z"/><path d="M30 30 l6 -4 v8 Z"/><path d="M66 30 l-6 -4 v8 Z"/></g><g fill="#1e293b" stroke="#475569" stroke-width="2"><circle cx="24" cy="30" r="8"/><circle cx="72" cy="30" r="8"/></g><circle cx="48" cy="30" r="7" fill="url(#bag)"/><circle cx="48" cy="72" r="10" fill="url(#bag)"/><path d="M43.5 72.4 l3.2 3.2 l6 -6.6" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg><text x="228" y="160.4" font-size="60" font-weight="800" fill="#1f2328" letter-spacing="-0.5">bryanAI</text><text x="80" y="264.0" font-size="34" font-weight="600" fill="#0ea5e9">A reasoning engine for</text><text x="80" y="308.0" font-size="34" font-weight="600" fill="#0ea5e9">argumentation.</text><text x="80" y="372.0" font-size="32" fill="#57606a">Decides which arguments stand when</text><text x="80" y="418.0" font-size="32" fill="#57606a">claims attack one another, built on</text><text x="80" y="464.0" font-size="32" fill="#57606a">the CaDiCaL SAT solver. Every</text><text x="80" y="510.0" font-size="32" fill="#57606a">answer is checked against the</text><text x="80" y="556.0" font-size="32" fill="#57606a">definition before it is given; when it</text><text x="80" y="602.0" font-size="32" fill="#57606a">cannot be sure, it says so rather than</text><text x="80" y="648.0" font-size="32" fill="#57606a">guess.</text><rect x="80.0" y="678" width="424.8" height="56" rx="28.0" fill="#d29922" fill-opacity="0.1" stroke="#d29922" stroke-opacity="0.55" stroke-width="1.5"/><text x="292.4" y="715.0" font-size="28" font-weight="600" fill="#9a6700" text-anchor="middle">Source pending ICCMA 2027</text><rect x="516.8" y="678" width="92.4" height="56" rx="28.0" fill="#14b8a6" fill-opacity="0.1" stroke="#14b8a6" stroke-opacity="0.55" stroke-width="1.5"/><text x="563.0" y="715.0" font-size="28" font-weight="600" fill="#0b766b" text-anchor="middle">C++</text></g></svg>
