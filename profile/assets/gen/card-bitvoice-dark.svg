<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 954" width="740" height="954" role="img" aria-label="BitVoice: Open-source business communications and 911."><title>BitVoice</title><desc>Open-source business communications and 911. One Go binary: a phone system, contact centre, video, chat and SMS, hosting for many organisations, an AI receptionist, and NG911 call handling with a P25 radio dispatch console, all from a built-in web console and built to the 911 reliability bar.</desc><style>.glow{opacity:0.75}.warm{opacity:0.7}</style><defs><linearGradient id="cardfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b222c"/><stop offset="1" stop-color="#121820"/></linearGradient><radialGradient id="accentglow" cx="0" cy="0" r="0.75" gradientTransform="scale(0.6 1)"><stop offset="0" stop-color="#14b8a6" stop-opacity="0.16"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient><linearGradient id="glowfill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="0.5" stop-color="#f58220"/><stop offset="1" stop-color="#ea580c"/></linearGradient><linearGradient id="warmfill" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#f58220" stop-opacity="0.2"/><stop offset="0.55" stop-color="#f58220" stop-opacity="0.04"/><stop offset="1" stop-color="#ffb347" stop-opacity="0.12"/></linearGradient><filter id="soft" x="-15%" y="-15%" width="130%" height="135%"><feGaussianBlur stdDeviation="20"/></filter><filter id="lift" x="-5%" y="-8%" width="110%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity="0.55"/></filter></defs><g font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><rect class="glow" x="36" y="48" width="668" height="876" rx="26" fill="url(#glowfill)" filter="url(#soft)"/><rect x="40" y="40" width="660" height="874" rx="22" fill="url(#cardfill)" stroke="#30363d" stroke-width="1.5" filter="url(#lift)"/><rect x="40" y="40" width="660" height="874" rx="22" fill="url(#accentglow)"/><rect class="warm" x="40" y="40" width="660" height="874" rx="22" fill="url(#warmfill)"/><rect x="40" y="66" width="5" height="822" rx="2.5" fill="#14b8a6"/><svg x="80" y="80" width="120" height="120" viewBox="0 0 96 96"><rect x="4" y="4" width="88" height="88" rx="20" fill="#0f172a"/><rect x="4.75" y="4.75" width="86.5" height="86.5" rx="19.25" fill="none" stroke="#2b3a52" stroke-width="1.5"/><defs><linearGradient id="bvg" gradientUnits="userSpaceOnUse" x1="20" y1="20" x2="76" y2="76"><stop offset="0" stop-color="#34d399"/><stop offset=".55" stop-color="#14b8a6"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs><g stroke="url(#bvg)" stroke-width="6" stroke-linecap="round"><path d="M24 42 V54"/><path d="M36 32 V64"/><path d="M48 22 V74"/><path d="M60 34 V62"/><path d="M72 42 V54"/></g></svg><text x="228" y="160.4" font-size="60" font-weight="800" fill="#f0f6fc" letter-spacing="-0.5">BitVoice</text><text x="80" y="264.0" font-size="34" font-weight="600" fill="#14b8a6">Open-source business</text><text x="80" y="308.0" font-size="34" font-weight="600" fill="#14b8a6">communications and 911.</text><text x="80" y="372.0" font-size="32" fill="#9ea8b3">One Go binary: a phone system,</text><text x="80" y="418.0" font-size="32" fill="#9ea8b3">contact centre, video, chat and SMS,</text><text x="80" y="464.0" font-size="32" fill="#9ea8b3">hosting for many organisations, an AI</text><text x="80" y="510.0" font-size="32" fill="#9ea8b3">receptionist, and NG911 call handling</text><text x="80" y="556.0" font-size="32" fill="#9ea8b3">with a P25 radio dispatch console, all</text><text x="80" y="602.0" font-size="32" fill="#9ea8b3">from a built-in web console and built</text><text x="80" y="648.0" font-size="32" fill="#9ea8b3">to the 911 reliability bar.</text><rect x="80.0" y="678" width="188.4" height="56" rx="28.0" fill="#388bfd" fill-opacity="0.16" stroke="#388bfd" stroke-opacity="0.55" stroke-width="1.5"/><text x="