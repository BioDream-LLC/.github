<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 806" width="720" height="806" role="img" aria-label="BitVoice: Open-source phone system and NG911 call handling."><title>BitVoice</title><desc>Open-source phone system and NG911 call handling. One Go binary: a complete office phone system, NG911 call handling, a P25 radio dispatch console and NG911 Core Services, configured from a built-in web console and built to the 911 reliability bar.</desc><defs><linearGradient id="cardfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b222c"/><stop offset="1" stop-color="#121820"/></linearGradient><radialGradient id="accentglow" cx="0" cy="0" r="0.75" gradientTransform="scale(0.6 1)"><stop offset="0" stop-color="#14b8a6" stop-opacity="0.16"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient><filter id="lift" x="-5%" y="-8%" width="110%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity="0.55"/></filter></defs><g font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><rect x="24" y="24" width="672" height="758" rx="22" fill="url(#cardfill)" stroke="#30363d" stroke-width="1.5" filter="url(#lift)"/><rect x="24" y="24" width="672" height="758" rx="22" fill="url(#accentglow)"/><rect x="24" y="50" width="5" height="706" rx="2.5" fill="#14b8a6"/><svg x="64" y="64" width="120" height="120" viewBox="0 0 96 96"><rect x="4" y="4" width="88" height="88" rx="20" fill="#0f172a"/><rect x="4.75" y="4.75" width="86.5" height="86.5" rx="19.25" fill="none" stroke="#2b3a52" stroke-width="1.5"/><defs><linearGradient id="bvg" gradientUnits="userSpaceOnUse" x1="20" y1="20" x2="76" y2="76"><stop offset="0" stop-color="#34d399"/><stop offset=".55" stop-color="#14b8a6"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs><g stroke="url(#bvg)" stroke-width="6" stroke-linecap="round"><path d="M24 42 V54"/><path d="M36 32 V64"/><path d="M48 22 V74"/><path d="M60 34 V62"/><path d="M72 42 V54"/></g></svg><text x="212" y="144.4" font-size="60" font-weight="800" fill="#f0f6fc" letter-spacing="-0.5">BitVoice</text><text x="64" y="248.0" font-size="34" font-weight="600" fill="#14b8a6">Open-source phone system and</text><text x="64" y="292.0" font-size="34" font-weight="600" fill="#14b8a6">NG911 call handling.</text><text x="64" y="356.0" font-size="32" fill="#9ea8b3">One Go binary: a complete office phone</text><text x="64" y="402.0" font-size="32" fill="#9ea8b3">system, NG911 call handling, a P25</text><text x="64" y="448.0" font-size="32" fill="#9ea8b3">radio dispatch console and NG911 Core</text><text x="64" y="494.0" font-size="32" fill="#9ea8b3">Services, configured from a built-in</text><text x="64" y="540.0" font-size="32" fill="#9ea8b3">web console and built to the 911</text><text x="64" y="586.0" font-size="32" fill="#9ea8b3">reliability bar.</text><rect x="64.0" y="616" width="188.4" height="56" rx="28.0" fill="#388bfd" fill-opacity="0.16" stroke="#388bfd" stroke-opacity="0.55" stroke-width="1.5"/><text x="158.2" y="653.0" font-size="28" font-weight="600" fill="#8cc4ff" text-anchor="middle">Apache 2.0</text><rect x="264.4" y="616" width="228.2" height="56" rx="28.0" fill="#2ea043" fill-opacity="0.16" stroke="#2ea043" stroke-opacity="0.55" stroke-width="1.5"/><text x="378.5" y="653.0" font-size="28" font-weight="600" fill="#7ee2a8" text-anchor="middle">PBX · working</text><rect x="64.0" y="686" width="346.4" height="56" rx="28.0" fill="#d29922" fill-opacity="0.16" stroke="#d29922" stroke-opacity="0.55" stroke-width="1.5"/><text x="237.2" y="723.0" font-size="28" font-weight="600" fill="#ffcf70" text-anchor="middle">911 · not yet certified</text></g></svg>
