="32" fill="#57606a">plain words; quorum tries every</text><text x="80" y="464.0" font-size="32" fill="#57606a">situation that could ever happen</text><text x="80" y="510.0" font-size="32" fill="#57606a">before the rules run, then decides on</text><text x="80" y="556.0" font-size="32" fill="#57606a">a Pico 2 or an Uno R4 with its</text><text x="80" y="602.0" font-size="32" fill="#57606a">reasons. Imports HAZOP, LOPA and</text><text x="80" y="648.0" font-size="32" fill="#57606a">FMEA worksheets; an AI can draft, a</text><text x="80" y="694.0" font-size="32" fill="#57606a">person approves.</text><rect x="80.0" y="724" width="264.3" height="56" rx="28.0" fill="#8b7bff" fill-opacity="0.1" stroke="#8b7bff" stroke-opacity="0.55" stroke-width="1.5"/><text x="212.2" y="761.0" font-size="28" font-weight="600" fill="#5a3fc0" text-anchor="middle">Source-available</text><rect x="356.3" y="724" width="240.8" height="56" rx="28.0" fill="#2ea043" fill-opacity="0.1" stroke="#2ea043" stroke-opacity="0.55" stroke-width="1.5"/><text x="476.7" y="761.0" font-size="28" font-weight="600" fill="#1a7f37" text-anchor="middle">Pico 2 · Uno R4</text><rect x="80.0" y="794" width="272.2" height="56" rx="28.0" fill="#d29922" fill-opacity="0.1" stroke="#d29922" stroke-opacity="0.55" stroke-width="1.5"/><text x="216.1" y="831.0" font-size="28" font-weight="600" fill="#9a6700" text-anchor="middle">Not yet certified</text></g></svg>
