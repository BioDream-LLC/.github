<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 806" width="720" height="806" role="img" aria-label="Perfuse: Open-source healthcare integration engine."><title>Perfuse</title><desc>Open-source healthcare integration engine. HL7 v2, FHIR, DICOM, X12 and CDA in one static binary, with all four CMS-0057-F payer APIs, tested with Inferno. A modern alternative to Mirth Connect: no JVM, no installer, no licence fee.</desc><defs><linearGradient id="cardfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b222c"/><stop offset="1" stop-color="#121820"/></linearGradient><radialGradient id="accentglow" cx="0" cy="0" r="0.75" gradientTransform="scale(0.6 1)"><stop offset="0" stop-color="#3b82f6" stop-opacity="0.16"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient><filter id="lift" x="-5%" y="-8%" width="110%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity="0.55"/></filter></defs><g font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><rect x="24" y="24" width="672" height="758" rx="22" fill="url(#cardfill)" stroke="#30363d" stroke-width="1.5" filter="url(#lift)"/><rect x="24" y="24" width="672" height="758" rx="22" fill="url(#accentglow)"/><rect x="24" y="50" width="5" height="706" rx="2.5" fill="#3b82f6"/><svg x="64" y="64" width="120" height="120" viewBox="0 0 96 96"><rect x="4" y="4" width="88" height="88" rx="20" fill="#0f172a"/><rect x="4.75" y="4.75" width="86.5" height="86.5" rx="19.25" fill="none" stroke="#2b3a52" stroke-width="1.5"/><defs><linearGradient id="pfg" gradientUnits="userSpaceOnUse" x1="18" y1="30" x2="62" y2="66"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs><g fill="none" stroke="url(#pfg)" stroke-width="3.5" stroke-linecap="round"><path d="M18 30 H34 Q44 30 46 40 L48 48"/><path d="M18 48 H46"/><path d="M18 66 H34 Q44 66 46 56 L48 48"/><path d="M48 48 H62"/></g><path d="M60 48 h5 l3.5 -13 l5 26 l4 -13 H82" fill="none" stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><g fill="url(#pfg)"><circle cx="18" cy="30" r="3.5"/><circle cx="18" cy="48" r="3.5"/><circle cx="18" cy="66" r="3.5"/></g></svg><text x="212" y="144.4" font-size="60" font-weight="800" fill="#f0f6fc" letter-spacing="-0.5">Perfuse</text><text x="64" y="248.0" font-size="34" font-weight="600" fill="#3b82f6">Open-source healthcare integration</text><text x="64" y="292.0" font-size="34" font-weight="600" fill="#3b82f6">engine.</text><text x="64" y="356.0" font-size="32" fill="#9ea8b3">HL7 v2, FHIR, DICOM, X12 and CDA in</text><text x="64" y="402.0" font-size="32" fill="#9ea8b3">one static binary, with all four</text><text x="64" y="448.0" font-size="32" fill="#9ea8b3">CMS-0057-F payer APIs, tested with</text><text x="64" y="494.0" font-size="32" fill="#9ea8b3">Inferno. A modern alternative to</text><text x="64" y="540.0" font-size="32" fill="#9ea8b3">Mirth Connect: no JVM, no installer, no</text><text x="64" y="586.0" font-size="32" fill="#9ea8b3">licence fee.</text><rect x="64.0" y="616" width="188.4" height="56" rx="28.0" fill="#388bfd" fill-opacity="0.16" stroke="#388bfd" stroke-opacity="0.55" stroke-width="1.5"/><text x="158.2" y="653.0" font-size="28" font-weight="600" fill="#8cc4ff" text-anchor="middle">Apache 2.0</text><rect x="264.4" y="616" width="248.6" height="56" rx="28.0" fill="#2ea043" fill-opacity="0.16" stroke="#2ea043" stroke-opacity="0.55" stroke-width="1.5"/><text x="388.8" y="653.0" font-size="28" font-weight="600" fill="#7ee2a8" text-anchor="middle">Inferno tested</text><rect x="525.1" y="616" width="77.6" height="56" rx="28.0" fill="#14b8a6" fill-opacity="0.16" stroke="#14b8a6" stroke-opacity="0.55" stroke-width="1.5"/><text x="563.9" y="653.0" font-size="28" font-weight="600" fill="#6ee7d8" text-anchor="middle">Go</text></g></svg>
