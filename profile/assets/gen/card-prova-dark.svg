<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 886" width="740" height="886" role="img" aria-label="prova: Financial protocol tests, proved."><title>prova</title><desc>Financial protocol tests, proved. Drives ISO 20022, ISO 8583 and FIX at payment hosts, card switches and trading venues, and proves whether each one behaved as it must: every verdict cites its rule and evidence, re-checked by a SAT solver and a second engine.</desc><style>.glow{opacity:0.75}.warm{opacity:0.7}</style><defs><linearGradient id="cardfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b222c"/><stop offset="1" stop-color="#121820"/></linearGradient><radialGradient id="accentglow" cx="0" cy="0" r="0.75" gradientTransform="scale(0.6 1)"><stop offset="0" stop-color="#6366f1" stop-opacity="0.16"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient><linearGradient id="glowfill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="0.5" stop-color="#f58220"/><stop offset="1" stop-color="#ea580c"/></linearGradient><linearGradient id="warmfill" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#f58220" stop-opacity="0.2"/><stop offset="0.55" stop-color="#f58220" stop-opacity="0.04"/><stop offset="1" stop-color="#ffb347" stop-opacity="0.12"/></linearGradient><filter id="soft" x="-15%" y="-15%" width="130%" height="135%"><feGaussianBlur stdDeviation="20"/></filter><filter id="lift" x="-5%" y="-8%" width="110%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity="0.55"/></filter></defs><g font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><rect class="glow" x="36" y="48" width="668" height="808" rx="26" fill="url(#glowfill)" filter="url(#soft)"/><rect x="40" y="40" width="660" height="806" rx="22" fill="url(#cardfill)" stroke="#30363d" stroke-width="1.5" filter="url(#lift)"/><rect x="40" y="40" width="660" height="806" rx="22" fill="url(#accentglow)"/><rect class="warm" x="40" y="40" width="660" height="806" rx="22" fill="url(#warmfill)"/><rect x="40" y="66" width="5" height="754" rx="2.5" fill="#6366f1"/><svg x="80" y="80" width="120" height="120" viewBox="0 0 96 96"><rect x="4" y="4" width="88" height="88" rx="20" fill="#0f172a"/><rect x="4.75" y="4.75" width="86.5" height="86.5" rx="19.25" fill="none" stroke="#2b3a52" stroke-width="1.5"/><defs><linearGradient id="pvg" gradientUnits="userSpaceOnUse" x1="22" y1="16" x2="74" y2="80"><stop offset="0" stop-color="#a5b4fc"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs><path d="M31 74 V22 H52 a15 15 0 0 1 0 30 H41" fill="none" stroke="url(#pvg)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 66 l7 7 l15 -16" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg><text x="228" y="160.4" font-size="60" font-weight="800" fill="#f0f6fc" letter-spacing="-0.5">prova</text><text x="80" y="264.0" font-size="34" font-weight="600" fill="#6366f1">Financial protocol tests, proved.</text><text x="80" y="328.0" font-size="32" fill="#9ea8b3">Drives ISO 20022, ISO 8583 and FIX</text><text x="80" y="374.0" font-size="32" fill="#9ea8b3">at payment hosts, card switches and</text><text x="80" y="420.0" font-size="32" fill="#9ea8b3">trading venues, and proves whether</text><text x="80" y="466.0" font-size="32" fill="#9ea8b3">each one behaved as it must: every</text><text x="80" y="512.0" font-size="32" fill="#9ea8b3">verdict cites its rule and evidence,</text><text x="80" y="558.0" font-size="32" fill="#9ea8b3">re-checked by a SAT solver and a</text><text x="80" y="604.0" font-size="32" fill="#9ea8b3">second engine.</text><rect x="80.0" y="634" width="264.3" height="56" rx="28.0" fill="#8b7bff" fill-opacity="0.16" stroke="#8b7bff" stroke-opacity="0.55" stroke-width="1.5"/><text x="212.2" y="671.0" font-size="28" font-weight="600" fill="#c2b8ff" text-anchor="middle">Source-available</text><rect x="356.3" y="634" width="176.7" height="56" rx="28.0" fill="#2ea043" fill-opacity="0.16" stroke="#2ea043" stroke-opacity="0.55" stroke-width="1.5"/><text x="444.7" y="671.0" font-size="28" font-weight="600" fill="#7ee2a8" text-anchor="middle">Live demo</text><rect x="545.0" y="634" width="77.6" height="56" rx="28.0" fill="#14b8a6" fill-opacity="0.16" stroke="#14b8a6" stroke-opacity="0.55" stroke-width="1.5"/><text x="583.8" y="671.0" font-size="28" font-weight="600" fill="#6ee7d8" text-anchor="middle">Go</text></g></svg>
