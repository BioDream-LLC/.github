<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 724" width="740" height="724" role="img" aria-label="Zyth: AI code, checked before it runs."><title>Zyth</title><desc>AI code, checked before it runs. Tensor shapes, types and devices are checked before anything runs, and every error comes with its fix. Then it runs at Go and Rust speed, on GPUs from a laptop to a data center, in the browser and inside React.</desc><style>.glow{opacity:0.5}.warm{opacity:0.7}</style><defs><linearGradient id="cardfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fa"/></linearGradient><radialGradient id="accentglow" cx="0" cy="0" r="0.75" gradientTransform="scale(0.6 1)"><stop offset="0" stop-color="#8b5cff" stop-opacity="0.09"/><stop offset="1" stop-color="#8b5cff" stop-opacity="0"/></radialGradient><linearGradient id="glowfill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="0.5" stop-color="#f58220"/><stop offset="1" stop-color="#ea580c"/></linearGradient><linearGradient id="warmfill" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#f58220" stop-opacity="0.1"/><stop offset="0.55" stop-color="#f58220" stop-opacity="0.04"/><stop offset="1" stop-color="#ffb347" stop-opacity="0.06"/></linearGradient><filter id="soft" x="-15%" y="-15%" width="130%" height="135%"><feGaussianBlur stdDeviation="20"/></filter><filter id="lift" x="-5%" y="-8%" width="110%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2328" flood-opacity="0.14"/></filter></defs><g font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><rect class="glow" x="36" y="48" width="668" height="646" rx="26" fill="url(#glowfill)" filter="url(#soft)"/><rect x="40" y="40" width="660" height="644" rx="22" fill="url(#cardfill)" stroke="#d0d7de" stroke-width="1.5" filter="url(#lift)"/><rect x="40" y="40" width="660" height="644" rx="22" fill="url(#accentglow)"/><rect class="warm" x="40" y="40" width="660" height="644" rx="22" fill="url(#warmfill)"/><rect x="40" y="66" width="5" height="592" rx="2.5" fill="#8b5cff"/><svg x="80" y="80" width="120" height="120" viewBox="0 0 96 96"><rect x="4" y="4" width="88" height="88" rx="20" fill="#0f172a"/><rect x="4.75" y="4.75" width="86.5" height="86.5" rx="19.25" fill="none" stroke="#2b3a52" stroke-width="1.5"/><defs><linearGradient id="zyg" gradientUnits="userSpaceOnUse" x1="22" y1="24" x2="74" y2="72"><stop offset="0" stop-color="#ff4fd8"/><stop offset=".5" stop-color="#8b5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><path d="M28.5 30 H67.5 L28.5 66 H67.5" fill="none" stroke="url(#zyg)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="67.5" cy="30" r="6.6" fill="#a3ff5c"/></svg><text x="228" y="160.4" font-size="60" font-weight="800" fill="#1f2328" letter-spacing="-0.5">Zyth</text><text x="80" y="264.0" font-size="34" font-weight="600" fill="#8b5cff">AI code, checked before it runs.</text><text x="80" y="328.0" font-size="32" fill="#57606a">Tensor shapes, types and devices are</text><text x="80" y="374.0" font-size="32" fill="#57606a">checked before anything runs, and</text><text x="80" y="420.0" font-size="32" fill="#57606a">every error comes with its fix. Then</text><text x="80" y="466.0" font-size="32" fill="#57606a">it runs at Go and Rust speed, on GPUs</text><text x="80" y="512.0" font-size="32" fill="#57606a">from a laptop to a data center, in the</text><text x="80" y="558.0" font-size="32" fill="#57606a">browser and inside React.</text><rect x="80.0" y="588" width="197.1" height="56" rx="28.0" fill="#2ea043" fill-opacity="0.1" stroke="#2ea043" stroke-opacity="0.55" stroke-width="1.5"/><text x="178.6" y="625.0" font-size="28" font-weight="600" fill="#1a7f37" text-anchor="middle">Free to use</text><rect x="289.1" y="588" width="174.4" height="56" rx="28.0" fill="#388bfd" fill-opacity="0.1" stroke="#388bfd" stroke-opacity="0.55" stroke-width="1.