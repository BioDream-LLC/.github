<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 806" width="720" height="806" role="img" aria-label="bitdispatcher: Open-source computer-aided dispatch."><title>bitdispatcher</title><desc>Open-source computer-aided dispatch. CAD with built-in records management, mobile units and radio data, for emergency communications centres. It connects to any call-handling system through open standards (NENA i3, EIDO).</desc><defs><linearGradient id="cardfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fa"/></linearGradient><radialGradient id="accentglow" cx="0" cy="0" r="0.75" gradientTransform="scale(0.6 1)"><stop offset="0" stop-color="#f97316" stop-opacity="0.09"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient><filter id="lift" x="-5%" y="-8%" width="110%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2328" flood-opacity="0.14"/></filter></defs><g font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><rect x="24" y="24" width="672" height="758" rx="22" fill="url(#cardfill)" stroke="#d0d7de" stroke-width="1.5" filter="url(#lift)"/><rect x="24" y="24" width="672" height="758" rx="22" fill="url(#accentglow)"/><rect x="24" y="50" width="5" height="706" rx="2.5" fill="#f97316"/><svg x="64" y="64" width="120" height="120" viewBox="0 0 96 96"><rect x="4" y="4" width="88" height="88" rx="20" fill="#0f172a"/><rect x="4.75" y="4.75" width="86.5" height="86.5" rx="19.25" fill="none" stroke="#2b3a52" stroke-width="1.5"/><defs><linearGradient id="bdg" gradientUnits="userSpaceOnUse" x1="18" y1="25" x2="78" y2="79"><stop offset="0" stop-color="#fbbf24"/><stop offset=".6" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><g fill="none" stroke="url(#bdg)" stroke-linecap="round"><ellipse cx="48" cy="70" rx="30" ry="9" stroke-width="2.5" stroke-opacity="0.45"/><ellipse cx="48" cy="70" rx="17" ry="5" stroke-width="3" stroke-opacity="0.8"/></g><path d="M48 70 C40 58 33 50 33 40 a15 15 0 0 1 30 0 C63 50 56 58 48 70 Z" fill="url(#bdg)"/><circle cx="48" cy="40" r="5.5" fill="#0f172a"/></svg><text x="212" y="144.4" font-size="60" font-weight="800" fill="#1f2328" letter-spacing="-0.5">bitdispatcher</text><text x="64" y="248.0" font-size="34" font-weight="600" fill="#f97316">Open-source computer-aided</text><text x="64" y="292.0" font-size="34" font-weight="600" fill="#f97316">dispatch.</text><text x="64" y="356.0" font-size="32" fill="#57606a">CAD with built-in records</text><text x="64" y="402.0" font-size="32" fill="#57606a">management, mobile units and radio</text><text x="64" y="448.0" font-size="32" fill="#57606a">data, for emergency communications</text><text x="64" y="494.0" font-size="32" fill="#57606a">centres. It connects to any</text><text x="64" y="540.0" font-size="32" fill="#57606a">call-handling system through open</text><text x="64" y="586.0" font-size="32" fill="#57606a">standards (NENA i3, EIDO).</text><rect x="64.0" y="616" width="250.9" height="56" rx="28.0" fill="#8b7bff" fill-opacity="0.1" stroke="#8b7bff" stroke-opacity="0.55" stroke-width="1.5"/><text x="189.4" y="653.0" font-size="28" font-weight="600" fill="#5a3fc0" text-anchor="middle">In development</text><rect x="326.9" y="616" width="188.4" height="56" rx="28.0" fill="#388bfd" fill-opacity="0.1" stroke="#388bfd" stroke-opacity="0.55" stroke-width="1.5"/><text x="421.1" y="653.0" font-size="28" font-weight="600" fill="#0b5cad" text-anchor="middle">Apache 2.0</text></g></svg>
