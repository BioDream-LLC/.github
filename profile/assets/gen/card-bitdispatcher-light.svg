<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 954" width="740" height="954" role="img" aria-label="bitdispatcher: Open-source 911 dispatch (CAD)."><title>bitdispatcher</title><desc>Open-source 911 dispatch (CAD). One Go binary for the 911 centre: units recommended by road time, an offline dispatch map, a screen for every monitor, fire-house and police boards with mark-outs and status checks, a supervisor board, a mobile terminal, NIBRS and NCIC, all from a built-in web console. Calls arrive by NENA i3 and EIDO, or from BitVoice.</desc><style>.glow{opacity:0.5}.warm{opacity:0.7}</style><defs><linearGradient id="cardfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fa"/></linearGradient><radialGradient id="accentglow" cx="0" cy="0" r="0.75" gradientTransform="scale(0.6 1)"><stop offset="0" stop-color="#f97316" stop-opacity="0.09"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient><linearGradient id="glowfill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="0.5" stop-color="#f58220"/><stop offset="1" stop-color="#ea580c"/></linearGradient><linearGradient id="warmfill" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#f58220" stop-opacity="0.1"/><stop offset="0.55" stop-color="#f58220" stop-opacity="0.04"/><stop offset="1" stop-color="#ffb347" stop-opacity="0.06"/></linearGradient><filter id="soft" x="-15%" y="-15%" width="130%" height="135%"><feGaussianBlur stdDeviation="20"/></filter><filter id="lift" x="-5%" y="-8%" width="110%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2328" flood-opacity="0.14"/></filter></defs><g font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><rect class="glow" x="36" y="48" width="668" height="876" rx="26" fill="url(#glowfill)" filter="url(#soft)"/><rect x="40" y="40" width="660" height="874" rx="22" fill="url(#cardfill)" stroke="#d0d7de" stroke-width="1.5" filter="url(#lift)"/><rect x="40" y="40" width="660" height="874" rx="22" fill="url(#accentglow)"/><rect class="warm" x="40" y="40" width="660" height="874" rx="22" fill="url(#warmfill)"/><rect x="40" y="66" width="5" height="822" rx="2.5" fill="#f97316"/><svg x="80" y="80" width="120" height="120" viewBox="0 0 96 96"><rect x="4" y="4" width="88" height="88" rx="20" fill="#0f172a"/><rect x="4.75" y="4.75" width="86.5" height="86.5" rx="19.25" fill="none" stroke="#2b3a52" stroke-width="1.5"/><defs><linearGradient id="bdg" gradientUnits="userSpaceOnUse" x1="18" y1="25" x2="78" y2="79"><stop offset="0" stop-color="#fbbf24"/><stop offset=".6" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><g fill="none" stroke="url(#bdg)" stroke-linecap="round"><ellipse cx="48" cy="70" rx="30" ry="9" stroke-width="2.5" stroke-opacity="0.45"/><ellipse cx="48" cy="70" rx="17" ry="5" stroke-width="3" stroke-opacity="0.8"/></g><path d="M48 70 C40 58 33 50 33 40 a15 15 0 0 1 30 0 C63 50 56 58 48 70 Z" fill="url(#bdg)"/><circle cx="48" cy="40" r="5.5" fill="#0f172a"/></svg><text x="228" y="160.4" font-size="60" font-weight="800" fill="#1f2328" letter-spacing="-0.5">bitdispatcher</text><text x="80" y="264.0" font-size="34" font-weight="600" fill="#f97316">Open-source 911 dispatch (CAD).</text><text x="80" y="328.0" font-size="32" fill="#57606a">One Go binary for the 911 centre:</text><text x="80" y="374.0" font-size="32" fill="#57606a">units recommended by road time, an</text><text x="80" y="420.0" font-size="32" fill="#57606a">offline dispatch map, a screen for</text><text x="80" y="466.0" font-size="32" fill="#57606a">every monitor, fire-house and police</text><text x="80" y="512.0" font-size="32" fill="#57606a">boards with mark-outs and status</text><text x="80" y="558.0" font-size="32" fill="#57606a">checks, a supervisor board, a mobile</text><text x="80" y="604.0" font-size="32" fill="#57606a">terminal, NIBRS and NCIC, all from a</text><text x="80" y="650.0" font-size="32" fill="#57606a">built-in web console. Calls arrive by</text><text x="80" y="696.0" font-size="32" fill="#57606a">NENA i3 and EIDO, or from BitVoice.</text><rect x="80.0" y="726" width="188.4" height="56" rx="28.0" fill="#388bfd" fill-opacity="0.1" stroke="#388bfd" stroke-opacity="0.55" stroke-width="1.5"/><text x="174.2" y="763.0" font-size="28" font-weight="600" fill="#0b5cad" text-anchor="middle">Apache 2.0</text><rect x="280.4" y="726" width="282.2" height="56" rx="28.0" fill="#2ea043" fill-opacity="0.1" stroke="#2ea043" stroke-opacity="0.55" stroke-width="1.5"/><text x="421.6" y="763.0" font-size="28" font-weight="600" fill="#1a7f37" text-anchor="middle">Fire · EMS · police</text><rect x="80.0" y="796" width="346.4" height="56" rx="28.0" fill="#d29922" fill-opacity="0.1" stroke="#d29922" stroke-opacity="0.55" stroke-width="1.5"/><text x="253.2" y="833.0" font-size="28" font-weight="600" fill="#9a6700" text-anchor="middle">911 · not yet certified</text></g></svg>
