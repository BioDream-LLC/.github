<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 768" width="740" height="768" role="img" aria-label="Vaglio: Prior authorization that proves its answer."><title>Vaglio</title><desc>Prior authorization that proves its answer. A decision engine for health plans that cannot deny care without proving why. Every answer cites the plan&#x27;s policy and the record, and missing evidence is asked for, never held against the patient.</desc><style>.glow{opacity:0.75}.warm{opacity:0.7}</style><defs><linearGradient id="cardfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b222c"/><stop offset="1" stop-color="#121820"/></linearGradient><radialGradient id="accentglow" cx="0" cy="0" r="0.75" gradientTransform="scale(0.6 1)"><stop offset="0" stop-color="#a855f7" stop-opacity="0.16"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient><linearGradient id="glowfill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="0.5" stop-color="#f58220"/><stop offset="1" stop-color="#ea580c"/></linearGradient><linearGradient id="warmfill" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#f58220" stop-opacity="0.2"/><stop offset="0.55" stop-color="#f58220" stop-opacity="0.04"/><stop offset="1" stop-color="#ffb347" stop-opacity="0.12"/></linearGradient><filter id="soft" x="-15%" y="-15%" width="130%" height="135%"><feGaussianBlur stdDeviation="20"/></filter><filter id="lift" x="-5%" y="-8%" width="110%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity="0.55"/></filter></defs><g font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><rect class="glow" x="36" y="48" width="668" height="690" rx="26" fill="url(#glowfill)" filter="url(#soft)"/><rect x="40" y="40" width="660" height="688" rx="22" fill="url(#cardfill)" stroke="#30363d" stroke-width="1.5" filter="url(#lift)"/><rect x="40" y="40" width="660" height="688" rx="22" fill="url(#accentglow)"/><rect class="warm" x="40" y="40" width="660" height="688" rx="22" fill="url(#warmfill)"/><rect x="40" y="66" width="5" height="636" rx="2.5" fill="#a855f7"/><svg x="80" y="80" width="120" height="120" viewBox="0 0 96 96"><rect x="4" y="4" width="88" height="88" rx="20" fill="#0f172a"/><rect x="4.75" y="4.75" width="86.5" height="86.5" rx="19.25" fill="none" stroke="#2b3a52" stroke-width="1.5"/><defs><linearGradient id="vgg" gradientUnits="userSpaceOnUse" x1="20" y1="14" x2="76" y2="70"><stop offset="0" stop-color="#f0abfc"/><stop offset=".5" stop-color="#c084fc"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><clipPath id="vgbowl"><path d="M22 38 A26 26 0 0 0 74 38 Z"/></clipPath></defs><g fill="url(#vgg)"><circle cx="36" cy="21" r="3.6"/><circle cx="48" cy="15" r="3.6"/><circle cx="60" cy="23" r="3.6"/></g><g clip-path="url(#vgbowl)" stroke="#c4b5fd" stroke-opacity=".55" stroke-width="1.8"><path d="M32 38 V66 M40 38 V66 M48 38 V66 M56 38 V66 M64 38 V66 M20 47 H76 M20 55 H76"/></g><path d="M22 38 A26 26 0 0 0 74 38" fill="none" stroke="url(#vgg)" stroke-width="4.5" stroke-linecap="round"/><path d="M16 38 H80" stroke="url(#vgg)" stroke-width="4.5" stroke-linecap="round"/><path d="M38 75 l7 7 l14 -14" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><text x="228" y="160.4" font-size="60" font-weight="800" fill="#f0f6fc" letter-spacing="-0.5">Vaglio</text><text x="80" y="264.0" font-size="34" font-weight="600" fill="#a855f7">Prior authorization that proves its</text><text x="80" y="308.0" font-size="34" font-weight="600" fill="#a855f7">answer.</text><text x="80" y="372.0" font-size="32" fill="#9ea8b3">A decision engine for health plans that</text><text x="80" y="418.0" font-size="32" fill="#9ea8b3">cannot deny care without proving</text><text x="80" y="464.0" font-size="32" fill="#9ea8b3">why. Every answer cites the plan&#x27;s</text><text x="80" y="510.0" font-size="32" fill="#9ea8b3">policy and the record, and missing</text><text x="80" y="556.0" font-size="32" fill="#9ea8b3">evidence is asked for, never held</text><text x="80" y="602.0" font-size="32" fill="#9ea8b3">against the patient.</text><rect x="80.0" y="632" width="264.3" height="56" rx="28.0" fill="#8b7bff" fill-opacity="0.16" stroke="#8b7bff" stroke-opacity="0.55" stroke-width="1.5"/><text x="212.2" y="669.0" font-size="28" font-weight="600" fill="#c2b8ff" text-anchor="middle">Source-available</text><rect x="356.3" y="632" width="222.0" height="56" rx="28.0" fill="#388bfd" fill-opacity="0.16" stroke="#388bfd" stroke-opacity="0.55" stroke-width="1.5"/><text x="467.3" y="669.0" font-size="28" font-weight="600" fill="#8cc4ff" text-anchor="middle">Uses Perfuse</text></g></svg>
