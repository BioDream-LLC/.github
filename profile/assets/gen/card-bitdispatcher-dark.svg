<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 840" width="740" height="840" role="img" aria-label="bitdispatcher: Open-source computer-aided dispatch."><title>bitdispatcher</title><desc>Open-source computer-aided dispatch. CAD with built-in records management, mobile units and radio data, for emergency communications centres. It connects to any call-handling system through open standards (NENA i3, EIDO).</desc><style>@keyframes glow{0%,100%{opacity:0.25}50%{opacity:1}}@keyframes warm{0%,100%{opacity:0}50%{opacity:1}}.glow{animation:glow 4.8s ease-in-out infinite;animation-delay:-2.40s}.warm{animation:warm 4.8s ease-in-out infinite;animation-delay:-2.40s}@media (prefers-reduced-motion: reduce){.glow,.warm{animation:none}.glow{opacity:0.45}.warm{opacity:0.5}}</style><defs><linearGradient id="cardfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b222c"/><stop offset="1" stop-color="#121820"/></linearGradient><radialGradient id="accentglow" cx="0" cy="0" r="0.75" gradientTransform="scale(0.6 1)"><stop offset="0" stop-color="#f97316" stop-opacity="0.16"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient><linearGradient id="glowfill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="0.5" stop-color="#f58220"/><stop offset="1" stop-color="#ea580c"/></linearGradient><linearGradient id="warmfill" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#f58220" stop-opacity="0.2"/><stop offset="0.55" stop-color="#f58220" stop-opacity="0.04"/><stop offset="1" stop-color="#ffb347" stop-opacity="0.12"/></linearGradient><filter id="soft" x="-15%" y="-15%" width="130%" height="135%"><feGaussianBlur stdDeviation="20"/></filter><filter id="lift" x="-5%" y="-8%" width="110%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity="0.55"/></filter></defs><g font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><rect class="glow" x="36" y="48" width="668" height="762" rx="26" fill="url(#glowfill)" filter="url(#soft)"/><rect x="40" y="40" width="660" height="760" rx="22" fill="url(#cardfill)" stroke="#30363d" stroke-width="1.5" filter="url(#lift)"/><rect x="40" y="40" width="660" height="760" rx="22" fill="url(#accentglow)"/><rect class="warm" x="40" y="40" width="660" height="760" rx="22" fill="url(#warmfill)"/><rect x="40" y="66" width="5" height="708" rx="2.5" fill="#f97316"/><svg x="80" y="80" width="120" height="120" viewBox="0 0 96 96"><rect x="4" y="4" width="88" height="88" rx="20" fill="#0f172a"/><rect x="4.75" y="4.75" width="86.5" height="86.5" rx="19.25" fill="none" stroke="#2b3a52" stroke-width="1.5"/><defs><linearGradient id="bdg" gradientUnits="userSpaceOnUse" x1="18" y1="25" x2="78" y2="79"><stop offset="0" stop-color="#fbbf24"/><stop offset=".6" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><g fill="none" stroke="url(#bdg)" stroke-linecap="round"><ellipse cx="48" cy="70" rx="30" ry="9" stroke-width="2.5" stroke-opacity="0.45"/><ellipse cx="48" cy="70" rx="17" ry="5" stroke-width="3" stroke-opacity="0.8"/></g><path d="M48 70 C40 58 33 50 33 40 a15 15 0 0 1 30 0 C63 50 56 58 48 70 Z" fill="url(#bdg)"/><circle cx="48" cy="40" r="5.5" fill="#0f172a"/></svg><text x="228" y="160.4" font-size="60" font-weight="800" fill="#f0f6fc" letter-spacing="-0.5">bitdispatcher</text><text x="80" y="264.0" font-size="34" font-weight="600" fill="#f97316">Open-source computer-aided</text><text x="80" y="308.0" font-size="34" font-weight="600" fill="#f97316">dispatch.</text><text x="80" y="372.0" font-size="32" fill="#9ea8b3">CAD with built-in records</text><text x="80" y="418.0" font-size="32" fill="#9ea8b3">management, mobile units and radio</text><text x="80" y="464.0" font-size="32" fill="#9ea8b3">data, for emergency communications</text><text x="80" y="510.0" font-size="32" fill="#9ea8b3">centres. It connects to any</text><text x="80" y="556.0" font-size="32" fill="#9ea8b3">call-handling system through open</text><text x="80" y="602.0" font-size="32" fill="#9ea8b3">standards (NENA i3, EIDO).</text><rect x="80.0" y="632" width="250.9" height="56" rx="28.0" fill="#8b7bff" fill-opacity="0.16" stroke="#8b7bff" stroke-opacity="0.55" stroke-width="1.5"/><text x="205.4" y="669.0" font-size="28" font-weight="600" fill="#c2b8ff" text-anchor="middle">In development</text><rect x="342.9" y="632" width="188.4" height="56" rx="28.0" fill="#388bfd" fill-opacity="0.16" stroke="#388bfd" stroke-opacity="0.55" stroke-width="1.5"/><text x="437.1" y="669.0" font-size="28" font-weight="600" fill="#8cc4ff" text-anchor="middle">Apache 2.0</text></g></svg>
