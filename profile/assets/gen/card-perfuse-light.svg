<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 838" width="740" height="838" role="img" aria-label="Perfuse: Open-source healthcare integration engine."><title>Perfuse</title><desc>Open-source healthcare integration engine. HL7 v2, FHIR, DICOM, X12 and CDA in one static binary, with all four CMS-0057-F payer APIs, tested with Inferno. A modern alternative to Mirth Connect: no JVM, no installer, no licence fee.</desc><style>@keyframes glow{0%,100%{opacity:0.15}50%{opacity:0.55}}@keyframes warm{0%,100%{opacity:0}50%{opacity:1}}.glow{animation:glow 4.8s ease-in-out infinite;animation-delay:-4.80s}.warm{animation:warm 4.8s ease-in-out infinite;animation-delay:-4.80s}@media (prefers-reduced-motion: reduce){.glow,.warm{animation:none}.glow{opacity:0.45}.warm{opacity:0.5}}</style><defs><linearGradient id="cardfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fa"/></linearGradient><radialGradient id="accentglow" cx="0" cy="0" r="0.75" gradientTransform="scale(0.6 1)"><stop offset="0" stop-color="#3b82f6" stop-opacity="0.09"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient><linearGradient id="glowfill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="0.5" stop-color="#f58220"/><stop offset="1" stop-color="#ea580c"/></linearGradient><linearGradient id="warmfill" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#f58220" stop-opacity="0.1"/><stop offset="0.55" stop-color="#f58220" stop-opacity="0.04"/><stop offset="1" stop-color="#ffb347" stop-opacity="0.06"/></linearGradient><filter id="soft" x="-15%" y="-15%" width="130%" height="135%"><feGaussianBlur stdDeviation="16"/></filter><filter id="lift" x="-5%" y="-8%" width="110%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2328" flood-opacity="0.14"/></filter></defs><g font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><rect class="glow" x="46" y="54" width="648" height="750" rx="26" fill="url(#glowfill)" filter="url(#soft)"/><rect x="40" y="40" width="660" height="758" rx="22" fill="url(#cardfill)" stroke="#d0d7de" stroke-width="1.5" filter="url(#lift)"/><rect x="40" y="40" width="660" height="758" rx="22" fill="url(#accentglow)"/><rect class="warm" x="40" y="40" width="660" height="758" rx="22" fill="url(#warmfill)"/><rect x="40" y="66" width="5" height="706" rx="2.5" fill="#3b82f6"/><svg x="80" y="80" width="120" height="120" viewBox="0 0 96 96"><rect x="4" y="4" width="88" height="88" rx="20" fill="#0f172a"/><rect x="4.75" y="4.75" width="86.5" height="86.5" rx="19.25" fill="none" stroke="#2b3a52" stroke-width="1.5"/><defs><linearGradient id="pfg" gradientUnits="userSpaceOnUse" x1="18" y1="30" x2="62" y2="66"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs><g fill="none" stroke="url(#pfg)" stroke-width="3.5" stroke-linecap="round"><path d="M18 30 H34 Q44 30 46 40 L48 48"/><path d="M18 48 H46"/><path d="M18 66 H34 Q44 66 46 56 L48 48"/><path d="M48 48 H62"/></g><path d="M60 48 h5 l3.5 -13 l5 26 l4 -13 H82" fill="none" stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><g fill="url(#pfg)"><circle cx="18" cy="30" r="3.5"/><circle cx="18" cy="48" r="3.5"/><circle cx="18" cy="66" r="3.5"/></g></svg><text x="228" y="160.4" font-size="60" font-weight="800" fill="#1f2328" letter-spacing="-0.5">Perfuse</text><text x="80" y="264.0" font-size="34" font-weight="600" fill="#3b82f6">Open-source healthcare integration</text><text x="80" y="308.0" font-size="34" font-weight="600" fill="#3b82f6">engine.</text><text x="80" y="372.0" font-size="32" fill="#57606a">HL7 v2, FHIR, DICOM, X12 and CDA in</text><text x="80" y="418.0" font-size="32" fill="#57606a">one static binary, with all four</text><text x="80" y="464.0" font-size="32" fill="#57606a">CMS-0057-F payer APIs, tested</text><text x="80" y="510.0" font-size="32" fill="#57606a">with Inferno. A modern alternative</text><text x="80" y="556.0" font-size="32" fill="#57606a">to Mirth Connect: no JVM, no</text><text x="80" y="602.0" font-size="32" fill="#57606a">installer, no licence fee.</text><rect x="80.0" y="632" width="188.4" height="56" rx="28.0" fill="#388bfd" fill-opacity="0.1" stroke="#388bfd" stroke-opacity="0.55" stroke-width="1.5"/><text x="174.2" y="669.0" font-size="28" font-weight="600" fill="#0b5cad" text-anchor="middle">Apache 2.0</text><rect x="280.4" y="632" width="248.6" height="56" rx="28.0" fill="#2ea043" fill-opacity="0.1" stroke="#2ea043" stroke-opacity="0.55" stroke-width="1.5"/><text x="404.8" y="669.0" font-size="28" font-weight="600" fill="#1a7f37" text-anchor="middle">Inferno tested</text><rect x="541.1" y="632" width="77.6" height="56" rx="28.0" fill="#14b8a6" fill-opacity="0.1" stroke="#14b8a6" stroke-opacity="0.55" stroke-width="1.5"/><text x="579.9" y="669.0" font-size="28" font-weight="600" fill="#0b766b" text-anchor="middle">Go</text></g></svg>
