<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-labelledby="t d">
  <title id="t">BioDream LLC</title>
  <desc id="d">Private on-device AI and open-source software for healthcare and public safety.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f6f6ff"/>
      <stop offset="1" stop-color="#ecebff"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f58220" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#f58220"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f3db8" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#3f3db8"/>
      <stop offset="1" stop-color="#1c1b5a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#f58220" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f58220" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1c1b5a" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" rx="24" fill="url(#bg)" stroke="#d8d8f0" stroke-width="2"/>
  <rect width="1280" height="340" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="340" rx="24" fill="url(#glow)"/>

  <!-- The helix from the BioDream mark: two strands crossing, joined by rungs. -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#1c1b5a" stroke-opacity="0.15" stroke-width="2">
      <path d="M760 132 V208"/><path d="M820 150 V190"/><path d="M940 150 V190"/><path d="M1000 132 V208"/>
      <path d="M1060 150 V190"/><path d="M1180 150 V190"/>
    </g>
    <path d="M640 170 C700 90 820 90 880 170 S1060 250 1120 170 S1220 110 1260 140" stroke="url(#orange)" stroke-width="10"/>
    <path d="M640 170 C700 250 820 250 880 170 S1060 90 1120 170 S1220 230 1260 200" stroke="url(#indigo)" stroke-width="10"/>
  </g>

  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="72" y="148" font-size="68" font-weight="800" fill="#1c1b5a" letter-spacing="-1">BioDream <tspan fill="#f58220">LLC</tspan></text>
    <text x="74" y="196" font-size="24" fill="#45457a">Private, on-device AI and open-source software</text>
    <text x="74" y="228" font-size="24" fill="#45457a">for healthcare and public safety.</text>

    <g font-size="15" font-weight="600">
      <rect x="74" y="258" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.9" stroke="#f58220" stroke-opacity="0.7"/>
      <text x="149" y="280" text-anchor="middle" fill="#c2570c">On-device AI</text>
      <rect x="236" y="258" width="214" height="34" rx="17" fill="#ffffff" fill-opacity="0.9" stroke="#3f3db8" stroke-opacity="0.8"/>
      <text x="343" y="280" text-anchor="middle" fill="#3f3db8">Healthcare integration</text>
      <rect x="462" y="258" width="146" height="34" rx="17" fill="#ffffff" fill-opacity="0.9" stroke="#0891b2" stroke-opacity="0.7"/>
      <text x="535" y="280" text-anchor="middle" fill="#0e7490">Public safety</text>
    </g>
  </g>
</svg>
